# Netlify: no build step, the repository root is the site.
# Deploy with `netlify deploy --prod`, or connect the repo in the Netlify UI
# and leave the build command empty.
[build]
  publish = "."
  command = ""

# The HTML must always be revalidated so a new deploy is picked up at once.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sprites, audio and fonts never change without a new filename.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
